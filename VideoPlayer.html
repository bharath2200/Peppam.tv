<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Movie Player - Peppam.tv</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">

    <!-- Video.js CSS -->
    <link href="https://vjs.zencdn.net/8.16.1/video-js.css" rel="stylesheet" />

    <style>
        /* Global Reset & Black Background */
        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: 'Poppins', sans-serif;
        }

        /* The 16:9 Container */
        .player-container {
            width: 100%;
            max-width: 1200px;
            aspect-ratio: 16 / 9;
            background: #000;
            position: relative;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.2);
            border-radius: 8px;
            overflow: hidden;
        }

        /* --- VIDEO.JS PEPPAM ORANGE THEME --- */
        :root {
            --main-orange: #ff6600;
        }

        .video-js {
            font-family: 'Poppins', sans-serif !important;
            width: 100% !important;
            height: 100% !important;
        }

        /* Centered Big Play Button */
        .video-js .vjs-big-play-button {
            background-color: rgba(255, 102, 0, 0.9) !important;
            border: 2px solid #ff6600 !important;
            color: #000 !important;
            border-radius: 50% !important;
            width: 2.2em !important;
            height: 2.2em !important;
            line-height: 2.1em !important;
            margin-top: -1.1em !important;
            margin-left: -1.1em !important;
            transition: transform 0.2s ease, background-color 0.2s ease, box-shadow 0.2s ease;
            box-shadow: 0 0 25px rgba(255, 102, 0, 0.6) !important;
        }

        .video-js:hover .vjs-big-play-button,
        .video-js .vjs-big-play-button:focus {
            background-color: #ff8533 !important;
            transform: scale(1.12);
            box-shadow: 0 0 35px rgba(255, 102, 0, 0.85) !important;
        }

        .video-js .vjs-play-progress {
            background-color: var(--main-orange) !important;
        }

        .video-js .vjs-play-progress:before {
            color: var(--main-orange) !important;
            top: -0.33em;
        }

        .video-js .vjs-volume-level {
            background-color: var(--main-orange) !important;
        }

        .video-js .vjs-control-bar {
            background: linear-gradient(180deg, transparent 0%, rgba(0, 0, 0, 0.9) 100%) !important;
            height: 3.6em;
            font-size: 14px;
        }

        .video-js .vjs-button:hover {
            color: var(--main-orange) !important;
        }

        .embed-frame {
            width: 100%;
            height: 100%;
            border: 0;
            display: block;
            background: #000;
        }
    </style>
</head>

<body>

    <div class="player-container" id="player-container">
        <video-js id="peppam-video" class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9" controls preload="auto" playsinline webkit-playsinline></video-js>
    </div>

    <!-- Scripts -->
    <script src="supabase-client.js"></script>
    <script src="https://vjs.zencdn.net/8.16.1/video.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/videojs-youtube/3.0.1/Youtube.min.js"></script>

    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            const container = document.getElementById('player-container');
            if (!container) return;

            // Get movie ID from URL
            const urlParams = new URLSearchParams(window.location.search);
            const movieId = urlParams.get('id') || 'telusu-kada';

            // Fetch movie from Supabase
            const movie = await fetchMovieById(movieId);
            let rawSource = (movie && movie.video_source) ? movie.video_source : "https://test-streams.mux.dev/x36xhzz/x36xhzz.m3u8";

            // If multi-language JSON is stored, pick first
            if (rawSource.trim().startsWith('{')) {
                try {
                    const parsed = JSON.parse(rawSource.trim());
                    const firstLang = Object.keys(parsed)[0];
                    if (firstLang) rawSource = parsed[firstLang];
                } catch (e) {}
            }

            const normalizeSourceUrl = (value) => {
                const rawValue = (value || '').trim();
                if (!rawValue) return '';

                const iframeMatch = rawValue.match(/src\s*=\s*["']([^"']+)["']/i);
                const extractedSource = iframeMatch ? iframeMatch[1] : rawValue;

                return extractedSource
                    .replace(/&amp;/gi, '&')
                    .replace(/^\/\//, 'https://')
                    .trim();
            };

            const getYouTubeId = (url) => {
                if (!url) return null;
                const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
                const match = url.match(regExp);
                return (match && match[2].length === 11) ? match[2] : null;
            };

            function getMimeType(url) {
                if (/\.m3u8(?:$|[?#])/i.test(url) || url.includes('m3u8')) return 'application/x-mpegURL';
                if (/\.mp4(?:$|[?#])/i.test(url)) return 'video/mp4';
                if (/\.webm(?:$|[?#])/i.test(url)) return 'video/webm';
                if (/\.ogg(?:$|[?#])/i.test(url)) return 'video/ogg';
                return 'video/mp4';
            }

            const normalizedSource = normalizeSourceUrl(rawSource);
            const videoId = getYouTubeId(normalizedSource);
            const isHttpUrl = /^https?:\/\//i.test(normalizedSource);
            const isM3u8Source = /\.m3u8(?:$|[?#])/i.test(normalizedSource) || normalizedSource.includes('m3u8');
            const isDirectMediaFile = /\.(mp4|webm|ogg|m4v|mov|mkv)(?:$|[?#])/i.test(normalizedSource);
            const isMkvFile = /\.mkv(?:$|[?#])/i.test(normalizedSource);
            const shouldUseIframe = isHttpUrl
                && !videoId
                && !isM3u8Source
                && !isDirectMediaFile;

            if (isMkvFile) {
                container.innerHTML = `
                    <div style="width:100%; height:100%; display:flex; flex-direction:column; align-items:center; justify-content:center; gap:16px; background:#111; padding:30px; box-sizing:border-box; text-align:center;">
                        <div style="font-size:2.8rem;">🎬</div>
                        <div style="color:#ff6600; font-size:1.1rem; font-weight:700;">MKV Format — Download to Watch</div>
                        <div style="color:#aaa; font-size:0.82rem; line-height:1.6; max-width:360px;">
                            Browsers cannot play <strong style="color:#fff;">MKV</strong> files directly.<br>
                            Download the file to watch in VLC or media players.
                        </div>
                        <a href="${normalizedSource}" download style="display:inline-block; background:#ff6600; color:#000; font-weight:700; padding:11px 28px; border-radius:25px; text-decoration:none; font-size:0.9rem;">
                            ⬇️ Download Movie
                        </a>
                    </div>`;
                return;
            }

            if (shouldUseIframe) {
                container.innerHTML = `<iframe class="embed-frame" src="${normalizedSource}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
                return;
            }

            let videoJsOptions = {
                autoplay: false,
                controls: true,
                responsive: true,
                fluid: true,
                playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                html5: {
                    vhs: {
                        overrideNative: true,
                        enableLowInitialPlaylist: true
                    }
                },
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'timeDivider',
                        'durationDisplay',
                        'progressControl',
                        'liveDisplay',
                        'remainingTimeDisplay',
                        'customControlSpacer',
                        'playbackRateMenuButton',
                        'subsCapsButton',
                        'audioTrackButton',
                        'pictureInPictureToggle',
                        'fullscreenToggle'
                    ]
                }
            };

            if (videoId) {
                videoJsOptions.techOrder = ['youtube'];
                videoJsOptions.sources = [{
                    type: 'video/youtube',
                    src: `https://www.youtube.com/watch?v=${videoId}`
                }];
                videoJsOptions.youtube = { ytControls: 2 };
            } else if (isM3u8Source) {
                videoJsOptions.sources = [{
                    src: normalizedSource,
                    type: 'application/x-mpegURL'
                }];
            } else {
                videoJsOptions.sources = [{
                    src: normalizedSource,
                    type: getMimeType(normalizedSource)
                }];
            }

            window.player = videojs('peppam-video', videoJsOptions, function onPlayerReady() {
                console.log('Video.js player ready on VideoPlayer.html');
            });
        });
    </script>
</body>

</html>
