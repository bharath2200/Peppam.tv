        <script>
            (function() {
                const adContainer = document.getElementById('container-91f9510d691261ad561d835e8a6dbc4e');
                if (!adContainer) return;

                function fixAdLayout() {
                    /* Remove any inline width/height the ad sets on table/tr/td */
                    adContainer.querySelectorAll('table, tbody, tr, td').forEach(el => {
                        el.removeAttribute('width');
                        el.removeAttribute('height');
                        el.style.removeProperty('width');
                        el.style.removeProperty('height');
                    });
                    /* Remove inline width on images */
                    adContainer.querySelectorAll('img').forEach(img => {
                        img.removeAttribute('width');
                        img.removeAttribute('height');
                        img.style.width = '100%';
                        img.style.height = 'auto';
                    });
                }

                /* Watch for the ad to inject its HTML, then fix it */
                const observer = new MutationObserver(() => {
                    if (adContainer.children.length > 0) {
                        fixAdLayout();
                    }
                });
                observer.observe(adContainer, { childList: true, subtree: true });

                /* Also try after delays in case MutationObserver misses it */
                setTimeout(fixAdLayout, 1000);
                setTimeout(fixAdLayout, 2500);
            })();
        </script>

    <script>

        // Get movie ID from URL parameter OR URL path for clean URLs
        function getMovieIdFromURL() {
            const urlParams = new URLSearchParams(window.location.search);
            if (urlParams.get('id')) return urlParams.get('id');

            // Find the last segment of the path (e.g. 'dude' from '/dude' or '/peppam.tv/dude')
            const pathSegments = window.location.pathname.split('/').filter(p => p !== "");
            const lastSegment = pathSegments[pathSegments.length - 1];

            // If it's a real file (e.g. index.html), don't treat it as a movie ID
            const knownPages = ['index.html', 'about.html', 'contact.html', 'admin.html', 'movie-detail.html', 'VideoPlayer.html'];
            if (lastSegment && !knownPages.includes(lastSegment)) {
                return decodeURIComponent(lastSegment);
            }

            return 'telusu-kada';
        }
        // --- MULTI-LANGUAGE SUPPORT ---

        // Parse video_source field: returns object if JSON multi-lang, else null
        // Admin stores: {"Telugu":"url1","Hindi":"url2","Tamil":"url3"}
        function parseVideoSources(videoSource) {
            if (!videoSource) return null;
            const trimmed = videoSource.trim();
            if (trimmed.startsWith('{')) {
                try {
                    const parsed = JSON.parse(trimmed);
                    if (typeof parsed === 'object' && !Array.isArray(parsed)) return parsed;
                } catch (e) {}
            }
            return null;
        }

        // Build language switcher buttons for separate per-language URLs
        function setupLanguageSwitcher(sources) {
            const switcher = document.getElementById('lang-switcher');
            const buttonsContainer = document.getElementById('lang-buttons');
            const langs = Object.keys(sources);

            if (langs.length === 0) { switcher.style.display = 'none'; return null; }

            switcher.style.display = 'flex';
            buttonsContainer.innerHTML = '';

            langs.forEach((lang, index) => {
                const btn = document.createElement('button');
                btn.textContent = lang;
                btn.className = 'lang-btn' + (index === 0 ? ' active' : '');
                btn.addEventListener('click', () => {
                    document.querySelectorAll('#lang-buttons .lang-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    switchVideoSource(sources[lang]);
                });
                buttonsContainer.appendChild(btn);
            });

            return sources[langs[0]]; // return first language URL to load by default
        }

        // Build audio-track switcher from Video.js HLS audio tracks
        function setupVideoJsAudioTracks(player) {
            if (!player) return;
            const audioTracks = player.audioTracks();
            if (!audioTracks) return;

            const switcher = document.getElementById('lang-switcher');
            const buttonsContainer = document.getElementById('lang-buttons');

            function renderTracks() {
                if (buttonsContainer.dataset.sourceType === 'multi-url') return;
                if (audioTracks.length <= 1) return;

                switcher.style.display = 'flex';
                buttonsContainer.innerHTML = '';

                for (let i = 0; i < audioTracks.length; i++) {
                    const track = audioTracks[i];
                    const btn = document.createElement('button');
                    btn.textContent = track.label || track.language || `Audio ${i + 1}`;
                    btn.className = 'lang-btn' + (track.enabled ? ' active' : '');
                    btn.addEventListener('click', () => {
                        for (let j = 0; j < audioTracks.length; j++) {
                            audioTracks[j].enabled = (j === i);
                        }
                        document.querySelectorAll('#lang-buttons .lang-btn').forEach(b => b.classList.remove('active'));
                        btn.classList.add('active');
                    });
                    buttonsContainer.appendChild(btn);
                }
            }

            audioTracks.addEventListener('addtrack', renderTracks);
            audioTracks.addEventListener('removetrack', renderTracks);
            audioTracks.addEventListener('change', renderTracks);
            renderTracks();
        }

        function getMimeType(url) {
            if (/\.m3u8(?:$|[?#])/i.test(url) || url.includes('m3u8')) return 'application/x-mpegURL';
            if (/\.mp4(?:$|[?#])/i.test(url)) return 'video/mp4';
            if (/\.webm(?:$|[?#])/i.test(url)) return 'video/webm';
            if (/\.ogg(?:$|[?#])/i.test(url)) return 'video/ogg';
            return 'video/mp4';
        }

        function switchVideoSource(url) {
            if (window.player && typeof window.player.src === 'function') {
                const normalized = normalizeSourceUrl(url);
                window.player.src({ src: normalized, type: getMimeType(normalized) });
                window.player.play().catch(() => {});
            } else {
                loadPlayer(url);
            }
        }

        const normalizeSourceUrl = (value) => {
            const rawValue = (value || '').trim();
            if (!rawValue) return '';

            const iframeMatch = rawValue.match(/src\s*=\s*["']([^"']+)["']/i);
            const extractedSource = iframeMatch ? iframeMatch[1] : rawValue;
            return extractedSource
                .replace(/&amp;/gi, '&')
                .replace(/^\/\//, 'https://')
                .trim();
        };

        const getYouTubeId = (url) => {
            if (!url) return null;
            const regExp = /^.*(youtu.be\/|v\/|u\/\w\/|embed\/|watch\?v=|\&v=)([^#\&\?]*).*/;
            const match = url.match(regExp);
            return (match && match[2].length === 11) ? match[2] : null;
        };

        // Initialize the Video.js + HLS.js player
        function loadPlayer(sourceUrl) {
            const container = document.getElementById('player-container');
            if (!container) return;

            // Destroy existing player
            if (window.player && typeof window.player.dispose === 'function') {
                try { window.player.dispose(); } catch (e) {}
                window.player = null;
            }

            const normalizedSource = normalizeSourceUrl(sourceUrl);
            const videoId = getYouTubeId(normalizedSource);
            const isHttpUrl = /^https?:\/\//i.test(normalizedSource);
            const isM3u8Source = /\.m3u8(?:$|[?#])/i.test(normalizedSource) || normalizedSource.includes('m3u8');
            const isDirectMediaFile = /\.(mp4|webm|ogg|m4v|mov|mkv)(?:$|[?#])/i.test(normalizedSource);
            const isMkvFile = /\.mkv(?:$|[?#])/i.test(normalizedSource);
            const shouldUseIframe = isHttpUrl && !videoId && !isM3u8Source && !isDirectMediaFile;

            // MKV — show download card
            if (isMkvFile) {
                container.innerHTML = `
                    <div style="width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;background:#111;border-radius:10px;padding:30px;box-sizing:border-box;text-align:center;">
                        <div style="font-size:3rem;">🎬</div>
                        <div style="color:#ff6600;font-size:1.1rem;font-weight:700;">MKV Format — Download to Watch</div>
                        <div style="color:#aaa;font-size:0.82rem;line-height:1.6;max-width:360px;">
                            Browsers cannot play <strong style="color:#fff;">MKV</strong> files directly.<br>
                            Download and watch in <strong style="color:#fff;">VLC</strong> or any media player.
                        </div>
                        <a href="${normalizedSource}" download style="background:#ff6600;color:#000;font-weight:700;padding:11px 28px;border-radius:25px;text-decoration:none;font-size:0.9rem;">
                            ⬇️ Download Movie
                        </a>
                        <div style="color:#555;font-size:0.72rem;margin-top:-6px;">Recommended: VLC Media Player</div>
                    </div>`;
                return;
            }

            // Iframe embed
            if (shouldUseIframe) {
                container.innerHTML = `<iframe class="embed-frame" src="${normalizedSource}" allow="autoplay; encrypted-media; picture-in-picture; fullscreen" allowfullscreen referrerpolicy="strict-origin-when-cross-origin"></iframe>`;
                return;
            }

            // ── Video.js + HLS.js Player ──
            container.innerHTML = `<video-js id="peppam-video" class="video-js vjs-default-skin vjs-big-play-centered vjs-16-9" controls preload="auto" playsinline webkit-playsinline></video-js>`;

            const videoJsOptions = {
                autoplay: false,
                controls: true,
                responsive: true,
                fluid: true,
                playbackRates: [0.5, 0.75, 1, 1.25, 1.5, 2],
                html5: {
                    vhs: { overrideNative: true, enableLowInitialPlaylist: true },
                    nativeAudioTracks: false,
                    nativeVideoTracks: false
                },
                controlBar: {
                    children: [
                        'playToggle',
                        'volumePanel',
                        'currentTimeDisplay',
                        'timeDivider',
                        'durationDisplay',
                        'progressControl',
                        'customControlSpacer',
                        'remainingTimeDisplay',
                        'playbackRateMenuButton',
                        'subsCapsButton',
                        'audioTrackButton',
                        'pictureInPictureToggle',
                        'fullscreenToggle'
                    ]
                }
            };

            if (videoId) {
                videoJsOptions.techOrder = ['youtube'];
                videoJsOptions.sources = [{ type: 'video/youtube', src: `https://www.youtube.com/watch?v=${videoId}` }];
                videoJsOptions.youtube = { ytControls: 2 };
            } else if (isM3u8Source) {
                videoJsOptions.sources = [{ src: normalizedSource, type: 'application/x-mpegURL' }];
            } else {
                videoJsOptions.sources = [{ src: normalizedSource, type: getMimeType(normalizedSource) }];
            }

            try {
                window.player = videojs('peppam-video', videoJsOptions, function onPlayerReady() {
                    console.log('Peppam Video.js player ready');
                    setupVideoJsAudioTracks(this);
                });
            } catch (err) {
                console.error('Video.js initialization error:', err);
            }
        }

        // Load movie data from Supabase
        async function loadMovieData() {
            const movieId = getMovieIdFromURL();
            const movie = await fetchMovieById(movieId);

            if (!movie) {
                console.error("Movie not found in Supabase.");
                document.getElementById('page-loader').innerHTML = '<h2 style="color: white;">Movie Not Found</h2>';
                return;
            }

            // Update page title and text content
            document.title = `${movie.title} - Peppam.tv`;
            document.getElementById('movie-title').textContent = movie.title;
            document.getElementById('movie-name').textContent = movie.title;
            document.getElementById('movie-year-display').textContent = movie.year;
            document.getElementById('movie-genre').textContent = movie.genre;
            document.getElementById('movie-cast').textContent = movie.cast_members;
            document.getElementById('movie-director').textContent = movie.director;

            // New fields
            if (movie.imdb_rating) {
                document.getElementById('info-imdb').style.display = 'block';
                document.getElementById('movie-imdb').textContent = movie.imdb_rating;
            }
            if (movie.writer) {
                document.getElementById('info-writer').style.display = 'block';
                document.getElementById('movie-writer').textContent = movie.writer;
            }
            if (movie.language) {
                document.getElementById('info-language').style.display = 'block';
                document.getElementById('movie-language').textContent = movie.language;
            }
            if (movie.quality) {
                document.getElementById('info-quality').style.display = 'block';
                document.getElementById('movie-quality').textContent = movie.quality;
            }
            if (movie.format) {
                document.getElementById('info-format').style.display = 'block';
                document.getElementById('movie-format').textContent = movie.format;
            }
            document.getElementById('movie-poster').src = movie.poster;
            document.getElementById('movie-poster').alt = `${movie.title} Movie Poster`;
            document.getElementById('movie-synopsis').textContent = movie.synopsis;
            // Convert URLs into clickable buttons and newlines into <br> tags
            let streamingInfo = movie.streaming_info || "";
            if (!streamingInfo.includes('<a')) {
                // Find HTTP/HTTPS links and convert to download buttons
                const urlRegex = /(https?:\/\/[^\s]+)/g;
                streamingInfo = streamingInfo.replace(urlRegex, '<a href="$1" class="download-link-btn" target="_blank">Click Here to Download / Watch</a>');
                // Replace remaining newlines with <br>
                streamingInfo = streamingInfo.replace(/\n/g, '<br>');
            }
            document.getElementById('movie-streaming-info').innerHTML = streamingInfo;

            // Render Screenshots
            const screenshotsWrapper = document.getElementById('movie-screenshots-wrapper');
            const screenshotsContainer = document.getElementById('movie-screenshots');
            if (movie.screenshots && movie.screenshots.trim() !== '') {
                const urls = movie.screenshots.split('\n').map(u => u.trim()).filter(u => u);
                if (urls.length > 0) {
                    screenshotsWrapper.style.display = 'block';
                    screenshotsContainer.innerHTML = urls.map(url => `<img src="${url}" alt="Screenshot" class="movie-screenshot-img">`).join('');
                } else {
                    screenshotsWrapper.style.display = 'none';
                }
            } else {
                screenshotsWrapper.style.display = 'none';
            }

            // Update the URL in the browser bar to look clean (e.g. peppamtv.live/dude)
            // This works by "masking" the complex URL with a clean one
            window.history.replaceState({ id: movie.id }, movie.title, `/${movie.id}`);

            // LOAD THE PLAYER FOR THIS SPECIFIC MOVIE
            try {
                if (movie.video_source) {
                    const multiSources = parseVideoSources(movie.video_source);
                    if (multiSources) {
                        // Multi-language: show switcher and load first language
                        const firstUrl = setupLanguageSwitcher(multiSources);
                        if (firstUrl) loadPlayer(firstUrl);
                    } else {
                        // Single source: hide switcher, load directly
                        document.getElementById('lang-switcher').style.display = 'none';
                        document.getElementById('lang-buttons').innerHTML = '';
                        loadPlayer(movie.video_source);
                    }
                } else {
                    console.log("No video source found for this movie.");
                }
            } catch (err) {
                console.error("Error loading video player:", err);
            } finally {

                // Hide loader and show content
                document.getElementById('page-loader').style.display = 'none';
                document.getElementById('main-content').style.display = 'block';
            }
        }

        // Load movie data when page loads
        window.addEventListener('DOMContentLoaded', loadMovieData);

        // Sidebar functionality
        const menuToggle = document.getElementById('menu-toggle');
        const sidebar = document.getElementById('sidebar');
        const sidebarClose = document.getElementById('sidebar-close');
        const sidebarOverlay = document.getElementById('sidebar-overlay');

        menuToggle.addEventListener('click', () => {
            sidebar.classList.add('active');
        });
        sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });
        sidebarOverlay.addEventListener('click', () => {
            sidebar.classList.remove('active');
        });
    </script>
</body>
